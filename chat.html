<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E7C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sema Kiswahili — Teaching Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">
<style>
  :root{
    --brand:#0E7C66;
    --brand-2:#0A5C4B;
    --brand-soft:#E6F4F0;
    --bg:#F2F6F4;
    --surface:#FFFFFF;
    --line:#E3EAE7;
    --text:#0F1F1B;
    --muted:#6B7C77;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#0c1a17;overscroll-behavior:none;}

  .app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);}
  @media (min-width:540px){
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(900px 600px at 20% 0%, #12503f 0%, transparent 60%),radial-gradient(700px 500px at 90% 100%, #0b3b34 0%, transparent 60%),#07110f;}
    .app{height:min(880px, calc(100dvh - 48px));border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);}
  }

  .view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s cubic-bezier(.32,.72,0,1);will-change:transform;}
  .chat-view{transform:translateX(100%);background:#EFF4F2;}
  .app.chat-open .view:not(.chat-view){transform:translateX(-24%);}
  .app.chat-open .chat-view{transform:translateX(0);}

  /* App bar */
  .appbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;background:linear-gradient(135deg,#0E7C66 0%,#0A5C4B 100%);color:#fff;}
  .brand-mark{width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:.5px;}
  .appbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;}
  .appbar p{margin:2px 0 0;font-size:12px;opacity:.85;font-weight:500;}

  /* Balance card */
  .balance-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 16px 4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(15,31,27,.04);}
  .balance-label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .balance-amount{font-size:20px;font-weight:800;color:var(--brand-2);letter-spacing:-.02em;margin-top:2px;}
  .withdraw-btn{padding:9px 16px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(14,124,102,.25);}
  .withdraw-btn:active{transform:scale(.97);}

  .searchwrap{position:relative;margin:12px 16px 6px;flex:0 0 auto;}
  .searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .searchwrap input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px 12px 42px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s;}
  .searchwrap input::placeholder{color:#9AA9A4;}
  .searchwrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,124,102,.12);}

  .section-label{flex:0 0 auto;padding:10px 18px 6px;font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);}
  .section-label span{color:var(--brand);}

  /* Chat list */
  .chat-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(14px + env(safe-area-inset-bottom));}
  .chat-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .12s;}
  .chat-item:active{background:#E7EFEC;}
  .chat-item:not(:last-child)::after{content:"";position:absolute;left:80px;right:16px;bottom:0;height:1px;background:var(--line);}

  .avatar{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--av,#0E7C66);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:.4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
  .avatar.sm{width:40px;height:40px;font-size:13.5px;}
  .dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:#22C55E;border:2.5px solid #fff;}

  .chat-item-body{flex:1;min-width:0;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .row + .row{margin-top:4px;}
  .name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rate-pill-sm{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.2px;color:var(--brand-2);background:var(--brand-soft);padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .row-meta{margin-top:4px;}
  .country{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;}
  .status{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;}
  .status.online{color:#16A34A;}
  .status.offline{color:var(--muted);}

  .empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;}

  /* Chat header */
  .chatbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 6px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(15,31,27,.04);z-index:2;}
  .icon-btn{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;color:var(--text);border-radius:50%;cursor:pointer;}
  .icon-btn:active{background:#EDF3F1;}
  .chatbar-info{flex:1;min-width:0;}
  .chatbar-info h2{margin:0;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chatbar-info p{margin:2px 0 0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .level-pill{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:6px 10px;border-radius:999px;}

  /* Session bar */
  .session-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--brand-soft);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--brand-2);letter-spacing:.01em;}
  .session-bar[hidden]{display:none;}
  .session-dot{width:7px;height:7px;border-radius:50%;background:#16A34A;display:block;flex:0 0 auto;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.85);}}
  .session-time{font-variant-numeric:tabular-nums;font-weight:800;}

  /* Messages */
  .messages{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:14px 14px 8px;background-image:radial-gradient(circle at 15% 8%, rgba(14,124,102,.06), transparent 42%),radial-gradient(circle at 88% 85%, rgba(14,124,102,.06), transparent 42%);}
  .day-divider{align-self:center;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.85);border:1px solid var(--line);padding:4px 12px;border-radius:999px;margin-bottom:4px;}
  .msg{display:flex;animation:pop .22s ease-out;}
  .msg.out{justify-content:flex-end;}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .bubble{max-width:78%;padding:9px 12px 6px;border-radius:16px;font-size:15px;line-height:1.42;word-wrap:break-word;overflow-wrap:anywhere;}
  .msg.in .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(15,31,27,.04);}
  .msg.out .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:5px;box-shadow:0 2px 8px rgba(14,124,102,.25);}
  .sub{display:block;margin-top:4px;font-size:12px;font-style:italic;color:var(--muted);}
  .meta{display:block;margin-top:3px;font-size:10px;text-align:right;opacity:.55;}
  .msg.out .meta{color:#fff;opacity:.72;}

  .tdots{display:inline-flex;gap:4px;align-items:center;padding:3px 0;}
  .tdots span{width:6px;height:6px;border-radius:50%;background:#9CB2AC;animation:blink 1.2s infinite ease-in-out;}
  .tdots span:nth-child(2){animation-delay:.18s;}
  .tdots span:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,65%,100%{opacity:.35;transform:translateY(0);}30%{opacity:1;transform:translateY(-2px);}}

  /* Quick replies */
  .quick-replies{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:none;}
  .quick-replies::-webkit-scrollbar{display:none;}
  .quick-replies[hidden]{display:none;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid rgba(14,124,102,.35);background:var(--brand-soft);color:var(--brand-2);font-family:inherit;font-size:13px;font-weight:650;white-space:nowrap;cursor:pointer;transition:transform .1s, background .15s;}
  .chip:active{transform:scale(.96);background:#D5EBE5;}

  /* Composer */
  .composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);}
  .composer input{flex:1;min-width:0;border:1px solid var(--line);background:#F3F7F5;border-radius:22px;padding:12px 16px;font-size:16px;font-family:inherit;color:var(--text);outline:none;transition:border-color .15s, background .15s;}
  .composer input:focus{border-color:var(--brand);background:#fff;}
  .send-btn{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(135deg,#0E7C66,#0A5C4B);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(14,124,102,.35);transition:transform .1s;}
  .send-btn:active{transform:scale(.93);}

  /* ── SweetAlert overrides ── */
  .swal2-popup{border-radius:20px !important;padding:24px 20px 20px !important;max-width:380px !important;width:92% !important;}
  .swal2-title{font-size:1.2rem !important;color:var(--brand-2) !important;font-weight:700 !important;margin-bottom:12px !important;}
  .swal2-html-container{font-size:.9rem !important;color:#1a1a1a !important;line-height:1.5 !important;margin:0 !important;padding:0 !important;}
  .swal2-actions{flex-direction:column !important;width:100% !important;gap:8px !important;margin-top:16px !important;}
  .swal2-actions .swal2-confirm,.swal2-actions .swal2-cancel{width:100% !important;margin:0 !important;border-radius:12px !important;padding:14px 18px !important;font-size:1rem !important;font-weight:600 !important;box-sizing:border-box !important;justify-content:center !important;min-height:52px !important;}
  .swal2-actions .swal2-confirm{background:linear-gradient(135deg,var(--brand),var(--brand-2)) !important;border:none !important;color:#fff !important;box-shadow:0 6px 16px rgba(14,124,102,.25) !important;}
  .swal2-actions .swal2-cancel{background:#f1f5f1 !important;border:1px solid #dce5dc !important;color:#1a2a1a !important;box-shadow:none !important;}
  .swal2-icon{display:none !important;}

  /* Phone input inside modal */
  .phone-input-wrap{display:flex;align-items:center;border:2px solid #dce5dc;border-radius:12px;background:#fff;overflow:hidden;transition:border-color .2s ease, box-shadow .2s ease;margin-top:4px;}
  .phone-input-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,124,102,.12);}
  .phone-prefix{background:#f0f5f0;padding:12px 14px;font-weight:600;color:#1a2a1a;border-right:1px solid #dce5dc;font-size:1rem;white-space:nowrap;flex-shrink:0;letter-spacing:.3px;}
  .phone-input{flex:1;border:none;padding:12px 14px;font-size:1rem;outline:none;background:transparent;min-width:0;font-family:inherit;color:#1a1a1a;}
  .phone-input::placeholder{color:#b0b8b0;font-weight:400;font-size:.9rem;}
  .phone-input-wrap.error{border-color:#dc3545 !important;box-shadow:0 0 0 3px rgba(220,53,69,.12) !important;}
  .phone-error-msg{color:#dc3545;font-size:.78rem;margin-top:6px;display:none;text-align:left;}
  .phone-error-msg.show{display:block;}

  .fee-details-box{text-align:left;background:#f8faf8;padding:14px 16px;border-radius:12px;margin-bottom:12px;border:1px solid #eaf0ea;}
  .fee-details-box .detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem;}
  .fee-details-box .detail-label{color:var(--muted);}
  .fee-details-box .detail-value{font-weight:600;color:#1a1a1a;}
  .fee-details-box .detail-value.primary{color:var(--brand-2);}

  /* STK overlay */
  .stk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:999;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .stk-overlay.show{display:flex;}
  .stk-card{background:var(--surface);border-radius:20px;padding:2rem;max-width:90%;width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .stk-icon{font-size:3rem;color:var(--brand);margin-bottom:1rem;}
  .stk-title{font-family:inherit;font-weight:700;font-size:1.25rem;color:var(--text);margin:0 0 .75rem;}
  .stk-message{color:var(--muted);margin-bottom:1rem;font-size:.95rem;line-height:1.4;}
  .stk-phone{background:var(--brand-soft);border-radius:12px;padding:.85rem;margin:1rem 0;font-weight:700;color:var(--brand-2);font-size:1rem;}
  .stk-timer{font-size:.9rem;color:var(--muted);margin-top:1rem;font-variant-numeric:tabular-nums;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;}
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============ LIST VIEW ============ -->
  <section class="view" id="listView">
    <header class="appbar">
      <div class="brand-mark">SK</div>
      <div>
        <h1>Sema Kiswahili</h1>
        <p>Hi <span id="tutorName">Tutor</span> · Teach &amp; earn</p>
      </div>
    </header>

    <div class="balance-card">
      <div>
        <div class="balance-label">Earnings balance</div>
        <div class="balance-amount" id="balanceAmount">KES 0</div>
      </div>
      <button class="withdraw-btn" id="withdrawBtn">Withdraw</button>
    </div>

    <div class="searchwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input id="search" type="search" placeholder="Search a learner or country" autocomplete="off" spellcheck="false">
    </div>

    <div class="section-label">Learners · <span id="count">181</span></div>
    <div class="chat-list" id="chatList"></div>
  </section>

  <!-- ============ CHAT VIEW ============ -->
  <section class="view chat-view" id="chatView">
    <header class="chatbar">
      <button class="icon-btn" id="backBtn" aria-label="Back to learners">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="avatar sm" id="chatAvatar">--</div>
      <div class="chatbar-info">
        <h2 id="chatName">—</h2>
        <p id="chatStatus">—</p>
      </div>
      <span class="level-pill" id="chatLevel">—</span>
    </header>

    <div class="session-bar" id="sessionBar" hidden>
      <span class="session-dot" aria-hidden="true"></span>
      <span>Session live</span>
      <span class="session-time" id="sessionTime">00:00</span>
    </div>

    <div class="messages" id="messages">
      <div class="day-divider">Today</div>
    </div>

    <div class="quick-replies" id="quickReplies" hidden></div>

    <form class="composer" id="composer">
      <input id="msgInput" type="text" placeholder="Andika ujumbe…" autocomplete="off" spellcheck="false" enterkeyhint="send">
      <button class="send-btn" type="submit" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/>
        </svg>
      </button>
    </form>
  </section>

</div>

<!-- STK overlay -->
<div class="stk-overlay" id="stkOverlay">
  <div class="stk-card">
    <div class="stk-icon">📱</div>
    <h2 class="stk-title">STK Push Sent</h2>
    <p class="stk-message">Check your phone for the M-Pesa prompt and enter your PIN.</p>
    <div class="stk-phone" id="stkPhoneNumber"></div>
    <p class="stk-message">Paying <strong id="stkAmount"></strong></p>
    <p class="stk-timer" id="stkTimer">Verifying payment…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
<script>
(() => {
  "use strict";

  /* ---------------- Tutor session guard ---------------- */
  const tutor = JSON.parse(sessionStorage.getItem("tutorProfile") || "{}");
  if (!tutor.name) {
    window.location.href = "signup.html";
    return;
  }
  document.getElementById("tutorName").textContent = tutor.name.split(" ")[0] || "Tutor";

  /* ================================================================
     LEARNERS — 181 active users, all online
     Hourly rate displayed in USD ($100 – $250)
     ================================================================ */
  const TOTAL_LEARNERS = 181;

  const FIRST_NAMES = [
    "Emma","Liam","Sofia","Yuki","Hans","Amara","Lucas","Chloé","Noah","Priya",
    "Ahmed","Isabella","Min-jun","Olivia","Diego","Anna","Chen","Fatima","Erik","Zara",
    "Mia","Ethan","Lucia","Kenji","Felix","Nadia","Pedro","Elena","Omar","Grace",
    "Leo","Aisha","Mateo","Hana","Jonas","Ingrid","Samuel","Rosa","Tariq","Mei",
    "Anders","Layla","Victor","Anya","Rafael","Chiara","David","Noor","Finn","Valentina"
  ];

  const LAST_NAMES = [
    "Wilson","Carter","Rossi","Tanaka","Müller","Okafor","Silva","Dubois","van Dijk","Sharma",
    "Hassan","García","Park","Brown","Fernández","Kowalska","Wei","Al-Zahra","Johansson","Khan",
    "Andersen","Lopez","Kim","Novak","Mensah","Petrov","Haddad","Sato","Nielsen","Osei",
    "Moreau","Ibrahim","Costa","Yilmaz","Jensen","Santos","Kaur","Kimani","Bianchi","Ondiek"
  ];

  const COUNTRIES = [
    { name:"United Kingdom", flag:"🇬🇧" },
    { name:"United States",  flag:"🇺🇸" },
    { name:"Italy",          flag:"🇮🇹" },
    { name:"Japan",          flag:"🇯🇵" },
    { name:"Germany",        flag:"🇩🇪" },
    { name:"Nigeria",        flag:"🇳🇬" },
    { name:"Brazil",         flag:"🇧🇷" },
    { name:"France",         flag:"🇫🇷" },
    { name:"Netherlands",    flag:"🇳🇱" },
    { name:"India",          flag:"🇮🇳" },
    { name:"Egypt",          flag:"🇪🇬" },
    { name:"Spain",          flag:"🇪🇸" },
    { name:"South Korea",    flag:"🇰🇷" },
    { name:"Australia",      flag:"🇦🇺" },
    { name:"Mexico",         flag:"🇲🇽" },
    { name:"Poland",         flag:"🇵🇱" },
    { name:"China",          flag:"🇨🇳" },
    { name:"Morocco",        flag:"🇲🇦" },
    { name:"Sweden",         flag:"🇸🇪" },
    { name:"Pakistan",       flag:"🇵🇰" }
  ];

  const LEVELS = ["Beginner","Elementary","Intermediate"];

  const GOALS = [
    "prepare for a business trip to Zanzibar",
    "work more effectively with colleagues in Nairobi",
    "volunteer on a health programme in Mombasa",
    "collaborate with a design team in Nairobi",
    "follow Swahili films without subtitles",
    "visit family friends in Kisumu",
    "join a football exchange in Kenya",
    "study abroad in Nairobi next semester",
    "prepare for a safari in the Maasai Mara",
    "introduce my students to East African culture",
    "work with suppliers based in Mombasa",
    "travel independently across East Africa",
    "build lasting friendships with Kenyan peers",
    "join a community project in Kilifi",
    "write songs that include Swahili lyrics",
    "work as a nurse in Tanzania",
    "add a third language to my professional skills",
    "read Swahili poetry in the original",
    "attend a wedding in Nairobi this December",
    "pursue a career in translation"
  ];

  const RAW = Array.from({ length: TOTAL_LEARNERS }, (_, i) => {
    const first   = FIRST_NAMES[i % FIRST_NAMES.length];
    const last    = LAST_NAMES[(i * 7 + 3) % LAST_NAMES.length];
    const country = COUNTRIES[i % COUNTRIES.length];
    return {
      name: `${first} ${last}`,
      first,
      country: country.name,
      flag: country.flag,
      level: LEVELS[i % LEVELS.length],
      online: true,                     // every learner is online
      goal: GOALS[i % GOALS.length],
      rate: 100 + ((i * 53) % 151)      // $100 – $250 / hr
    };
  });

  const PALETTE = ["#E4572E","#0E7C66","#7C3AED","#0891B2","#DB2777","#F59E0B","#2563EB","#059669","#B45309","#9333EA","#DC2626","#0D9488","#4F46E5","#CA8A04","#BE185D","#0284C7","#65A30D","#C026D3","#EA580C","#0F766E"];

  const contacts = RAW.map((c, i) => ({
    ...c,
    id: i + 1,
    initials: c.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase(),
    color: PALETTE[i % PALETTE.length]
  }));

  const CANNED = [
    { t:"Asante sana.",                                s:"Thank you very much." },
    { t:"Habari yako?",                                s:"How are you?" },
    { t:"Polepole tafadhali.",                         s:"Slowly, please." },
    { t:"Nimefurahi. Ninajifunza kila siku.",          s:"I am glad. I study every day." },
    { t:"Hii ni nzuri sana.",                          s:"This is very good." },
    { t:"Naweza kusema Kiswahili kidogo.",             s:"I can speak a little Swahili." }
  ];

  const QUICK = [
    "Jambo! Habari yako?",
    "Karibu — welcome.",
    "Unajifunza Kiswahili?",
    "Pole pole, tutasaidiana."
  ];

  /* ---------------- Elements ---------------- */
  const app          = document.getElementById("app");
  const chatList     = document.getElementById("chatList");
  const countEl      = document.getElementById("count");
  const searchEl     = document.getElementById("search");
  const messages     = document.getElementById("messages");
  const composer     = document.getElementById("composer");
  const msgInput     = document.getElementById("msgInput");
  const backBtn      = document.getElementById("backBtn");
  const chatName     = document.getElementById("chatName");
  const chatStatus   = document.getElementById("chatStatus");
  const chatAvatar   = document.getElementById("chatAvatar");
  const chatLevel    = document.getElementById("chatLevel");
  const quickWrap    = document.getElementById("quickReplies");
  const sessionBar   = document.getElementById("sessionBar");
  const sessionTimeEl = document.getElementById("sessionTime");
  const balanceAmount = document.getElementById("balanceAmount");
  const withdrawBtn  = document.getElementById("withdrawBtn");
  const stkOverlay   = document.getElementById("stkOverlay");
  const stkPhoneEl   = document.getElementById("stkPhoneNumber");
  const stkAmountEl  = document.getElementById("stkAmount");
  const stkTimerEl   = document.getElementById("stkTimer");

  /* ---------------- State ---------------- */
  let current   = null;
  let session   = 0;
  let typingEl  = null;
  let replyIdx  = 0;
  let autoReplyScheduled = false;
  let autoReplySent = false;
  let closeTimer = null;
  let conversationPhase = "idle";
  let chatHistoryPushed = false;
  let suppressNextPopstate = false;

  let stkTimerInterval = null;
  let pollInterval = null;

  const CONVERSATION_EARNINGS = 8600;
  let earningsBalance = Number(localStorage.getItem("earningsBalance") || 0);

  /* ---------------- Balance ---------------- */
  function updateBalanceDisplay() {
    balanceAmount.textContent = "KES " + earningsBalance.toLocaleString("en-KE");
  }
  function addEarnings(amount) {
    earningsBalance += amount;
    localStorage.setItem("earningsBalance", String(earningsBalance));
    updateBalanceDisplay();
  }

  /* ================================================================
     PER-LEARNER ACTIVATION
     Each learner is unlocked individually. Paying for one learner
     only opens that learner's chat — not all of them.
     ================================================================ */
  const ACTIVATED_KEY = "activatedContacts";

  function isContactActivated(id) {
    try {
      const list = JSON.parse(localStorage.getItem(ACTIVATED_KEY) || "[]");
      return Array.isArray(list) && list.includes(id);
    } catch (e) {
      return false;
    }
  }

  function markContactActivated(id) {
    let list = [];
    try { list = JSON.parse(localStorage.getItem(ACTIVATED_KEY) || "[]"); } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];
    if (!list.includes(id)) list.push(id);
    localStorage.setItem(ACTIVATED_KEY, JSON.stringify(list));
  }

  /* ================================================================
     PHONE NORMALIZATION (client-side fallback — backend re-validates)
     ================================================================ */
  function normalizePhoneForBackend(raw) {
    if (!raw) return null;
    let digits = raw.replace(/\D/g, '');
    if (!digits.length) return null;
    if (digits.startsWith('254')) {
      if (digits.length >= 12) return digits.substring(0, 12);
      return null;
    }
    if (digits.startsWith('0')) digits = digits.substring(1);
    if (digits.length >= 9) digits = digits.substring(0, 9);
    if (digits.length < 9) return null;
    const first = digits.charAt(0);
    if (first !== '7' && first !== '1') return null;
    return '254' + digits;
  }

  function displayPhone(phone254) {
    if (!phone254 || phone254.length !== 12) return phone254 || '';
    return '0' + phone254.substring(3);
  }

  /* ================================================================
     BACKEND — initiate STK via /api/initiate-payment
     The api/initiate-payment.js handler converts 2547… → 07… and
     talks to MegaPay, returning { reference, external_reference }.
     ================================================================ */
  async function initiateSTK(phone254, amount) {
    const response = await fetch('/api/initiate-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone_number: phone254,
        amount: Number(amount)
      })
    });

    const result = await response.json().catch(() => ({}));
    console.log('[api/initiate-payment] response:', result);

    if (!response.ok || !result.success || !result.reference) {
      throw new Error(result.error || result.message || 'Payment initiation failed');
    }

    return { reference: result.reference, external: result.external_reference };
  }

  /* ================================================================
     BACKEND — poll /api/verify-payment
     The handler normalises MegaPay's response into
     COMPLETED / PENDING / FAILED / CANCELLED / UNKNOWN.
     ================================================================ */
  function pollStatus(reference, maxAttempts = 30) {
    return new Promise((resolve, reject) => {
      let attempts = 0;
      pollInterval = setInterval(async () => {
        attempts++;
        try {
          const response = await fetch(`/api/verify-payment?reference=${encodeURIComponent(reference)}`);
          const result = await response.json().catch(() => ({}));
          console.log('[api/verify-payment] response:', result);

          const status = String(result.status || '').toUpperCase();

          if (status === 'COMPLETED') {
            clearInterval(pollInterval); pollInterval = null;
            resolve(true);
          } else if (status === 'FAILED' || status === 'CANCELLED') {
            clearInterval(pollInterval); pollInterval = null;
            reject(new Error('Payment failed or was cancelled'));
          } else if (attempts >= maxAttempts) {
            clearInterval(pollInterval); pollInterval = null;
            reject(new Error('Verification timed out'));
          }
        } catch (err) {
          console.error('[api/verify-payment] error:', err);
          if (attempts >= maxAttempts) {
            clearInterval(pollInterval); pollInterval = null;
            reject(new Error('Verification failed'));
          }
        }
      }, 3000);
    });
  }

  /* ================================================================
     STK OVERLAY
     ================================================================ */
  function showStkOverlay(phone254, amount) {
    stkPhoneEl.textContent = displayPhone(phone254);
    stkAmountEl.textContent = 'KES ' + Number(amount).toLocaleString('en-KE');
    stkTimerEl.textContent = 'Verifying payment…';
    let seconds = 0;
    if (stkTimerInterval) clearInterval(stkTimerInterval);
    stkTimerInterval = setInterval(() => {
      seconds++;
      const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
      const ss = String(seconds % 60).padStart(2, '0');
      stkTimerEl.textContent = `Verifying payment… ${mm}:${ss}`;
    }, 1000);
    stkOverlay.classList.add('show');
  }

  function hideStkOverlay() {
    stkOverlay.classList.remove('show');
    if (stkTimerInterval) { clearInterval(stkTimerInterval); stkTimerInterval = null; }
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
  }

  /* ================================================================
     CHARGE FEE — modal → /api/initiate-payment → poll → resolve
     ================================================================ */
  async function chargeFee({ amount, title, description }) {
    const result = await Swal.fire({
      title: title,
      html: `
        <div style="padding: 0 4px;">
          <div class="fee-details-box">
            <div class="detail-row">
              <span class="detail-label">Amount to pay</span>
              <span class="detail-value primary">KES ${Number(amount).toLocaleString('en-KE')}</span>
            </div>
          </div>
          <p style="text-align:left; font-size:0.92rem; color:#4a5a4a; margin: 0 0 8px;">${description}</p>
          <div style="text-align:left; margin-top: 4px;">
            <label style="font-weight:600; font-size:0.9rem; color:#1a1a1a; display:block; margin-bottom:4px;">M-Pesa Phone Number</label>
            <div class="phone-input-wrap" id="phone-wrap">
              <span class="phone-prefix">+254</span>
              <input type="tel" class="phone-input" id="phone-input-modal" placeholder="7XXXXXXXX" autocomplete="off" inputmode="numeric" pattern="[0-9]*" />
            </div>
            <div class="phone-error-msg" id="phone-error-msg">Please enter a valid phone number.</div>
          </div>
        </div>
      `,
      icon: false,
      showCancelButton: true,
      confirmButtonText: `Pay KES ${Number(amount).toLocaleString('en-KE')}`,
      cancelButtonText: 'Cancel',
      buttonsStyling: false,
      customClass: { confirmButton: 'swal2-confirm', cancelButton: 'swal2-cancel', actions: 'swal2-actions' },
      allowOutsideClick: false,
      allowEscapeKey: false,
      focusConfirm: false,
      didOpen: () => {
        const input = document.getElementById('phone-input-modal');
        if (input) {
          setTimeout(() => input.focus(), 120);
          input.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
            const wrap = document.getElementById('phone-wrap');
            const err = document.getElementById('phone-error-msg');
            if (wrap) wrap.classList.remove('error');
            if (err) err.classList.remove('show');
          });
        }
      },
      preConfirm: async () => {
        const input = document.getElementById('phone-input-modal');
        const wrap = document.getElementById('phone-wrap');
        const err = document.getElementById('phone-error-msg');

        const showError = (msg) => {
          if (wrap) wrap.classList.add('error');
          if (err) { err.textContent = msg; err.classList.add('show'); }
          return false;
        };

        if (!input) return false;
        const raw = input.value.trim();
        if (!raw) return showError('Please enter your phone number.');

        // Validate against the backend first, then fall back to local rules.
        let normalized = null;
        try {
          const r = await fetch('/api/normalize-phone', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: raw })
          });
          const d = await r.json().catch(() => ({}));
          if (r.ok && d && d.normalized_phone) normalized = d.normalized_phone;
        } catch (e) {
          console.warn('normalize-phone API unavailable — using local fallback', e);
        }

        if (!normalized) normalized = normalizePhoneForBackend(raw);

        if (!normalized) {
          return showError('Please enter a valid Kenyan phone number (07… or 01…).');
        }
        if (!normalized.startsWith('2547') && !normalized.startsWith('2541')) {
          return showError('Please enter a valid Kenyan phone number (07… or 01…).');
        }

        window._feePhone = normalized;
        return true;
      }
    });

    if (!result.isConfirmed) return false;
    const phone254 = window._feePhone;
    if (!phone254) return false;

    try {
      Swal.fire({
        title: 'Sending M-Pesa prompt…',
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => Swal.showLoading()
      });

      const { reference } = await initiateSTK(phone254, amount);
      Swal.close();

      showStkOverlay(phone254, amount);
      await pollStatus(reference, 30);
      hideStkOverlay();
      return true;
    } catch (err) {
      console.error('Payment flow error:', err);
      hideStkOverlay();
      Swal.close();
      await Swal.fire({
        title: 'Payment not completed',
        html: 'We could not confirm your M-Pesa payment.<br><br>Please try again, or check your M-Pesa balance and retry.',
        icon: 'error',
        confirmButtonText: 'Try again',
        confirmButtonColor: '#0E7C66'
      });
      return false;
    }
  }

  /* ================================================================
     OPEN CHAT — per-learner activation gate
     ================================================================ */
  async function tryOpenChat(contact) {
    if (isContactActivated(contact.id)) {
      openChat(contact);
      return;
    }

    const paid = await chargeFee({
      amount: 199,
      title: `Unlock ${contact.first}'s chat`,
      description: `Pay KES 199 once to unlock your conversation with ${contact.first} from ${contact.country}. This unlock applies to this learner only.`
    });

    if (paid) {
      markContactActivated(contact.id);
      await Swal.fire({
        title: 'Chat unlocked',
        html: `You can now teach <strong>${contact.first}</strong> and start earning.`,
        icon: 'success',
        confirmButtonText: 'Start teaching',
        confirmButtonColor: '#0E7C66'
      });
      openChat(contact);
    }
  }

  /* ================================================================
     CONVERSATION / TIMERS
     ================================================================ */
  const nowTime = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });

  function later(fn, ms) {
    const gen = session;
    return setTimeout(() => { if (gen === session) fn(); }, ms);
  }
  function typingDelay(text) {
    const ms = 750 + text.length * 60;
    return Math.max(1100, Math.min(ms, 3000));
  }
  const readPause = (min, max) => min + Math.random() * (max - min);
  function clearCloseTimer() {
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  }

  let sessionTimer = null;
  let sessionStart = 0;
  function updateSessionDisplay() {
    const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const ss = String(elapsed % 60).padStart(2, "0");
    sessionTimeEl.textContent = `${mm}:${ss}`;
  }
  function startSessionTimer() {
    stopSessionTimer();
    sessionStart = Date.now();
    updateSessionDisplay();
    sessionBar.hidden = false;
    sessionTimer = setInterval(updateSessionDisplay, 1000);
  }
  function stopSessionTimer() {
    if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
    sessionBar.hidden = true;
  }

  /* ---------------- List rendering ---------------- */
  function renderList(query = "") {
    const q = query.trim().toLowerCase();
    const items = contacts.filter(c => !q || c.name.toLowerCase().includes(q) || c.country.toLowerCase().includes(q));
    countEl.textContent = items.length;
    if (!items.length) {
      chatList.innerHTML = `<div class="empty">No learners found.<br>Try another name or country.</div>`;
      return;
    }
    chatList.innerHTML = items.map(c => `
      <button class="chat-item" data-id="${c.id}">
        <div class="avatar" style="--av:${c.color}">
          ${c.initials}
          ${c.online ? '<span class="dot"></span>' : ""}
        </div>
        <div class="chat-item-body">
          <div class="row">
            <span class="name">${c.name}</span>
            <span class="rate-pill-sm">$${c.rate}/hr</span>
          </div>
          <div class="row row-meta">
            <span class="country">${c.flag} ${c.country}</span>
            <span class="status ${c.online ? "online" : "offline"}">${c.online ? "Online" : "Offline"}</span>
          </div>
        </div>
      </button>
    `).join("");
  }

  /* ---------------- Messages ---------------- */
  function scrollBottom() {
    requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
  }

  function addBubble(text, dir, sub) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + dir;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = text;
    bubble.appendChild(txt);
    if (sub) {
      const s = document.createElement("span");
      s.className = "sub";
      s.textContent = sub;
      bubble.appendChild(s);
    }
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = nowTime();
    bubble.appendChild(meta);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    scrollBottom();
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "msg in";
    typingEl.innerHTML = '<div class="bubble"><span class="tdots"><span></span><span></span><span></span></span></div>';
    messages.appendChild(typingEl);
    scrollBottom();
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  /* ---------------- Quick replies ---------------- */
  function showQuickReplies() {
    quickWrap.innerHTML = QUICK.map(q => `<button type="button" class="chip">${q}</button>`).join("");
    quickWrap.hidden = false;
  }
  function hideQuickReplies() {
    quickWrap.hidden = true;
    quickWrap.innerHTML = "";
  }
  quickWrap.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) sendMessage(chip.textContent);
  });

  /* ================================================================
     OPEN / CLOSE CHAT
     ================================================================ */
  function openChat(contact) {
    session++;
    current = contact;
    autoReplyScheduled = false;
    autoReplySent = false;
    conversationPhase = "active";
    clearCloseTimer();

    chatAvatar.textContent = contact.initials;
    chatAvatar.style.setProperty("--av", contact.color);
    chatName.textContent = contact.name;
    chatStatus.textContent = `${contact.flag} ${contact.country} · Online now`;
    chatLevel.textContent = contact.level;

    messages.innerHTML = '<div class="day-divider">Today</div>';
    hideQuickReplies();
    msgInput.value = "";

    if (!chatHistoryPushed) {
      try {
        history.pushState({ chat: true }, "");
        chatHistoryPushed = true;
      } catch (e) { /* ignore */ }
    }

    app.classList.add("chat-open");
    requestAnimationFrame(() => { messages.scrollTop = 0; });

    startSessionTimer();
    playGreeting(contact);
  }

  function playGreeting(c) {
    const lines = [
      { t: "Jambo! 👋", s: "Hello — a standard Swahili greeting." },
      { t: `Mimi ni ${c.first}. Nimefurahi kukutana nawe.`, s: `My name is ${c.first}. It is a pleasure to meet you.` },
      { t: `My goal is to ${c.goal}. I would value your guidance.`, s: "" }
    ];
    let i = 0;
    const deliverNext = () => {
      if (i >= lines.length) { showQuickReplies(); return; }
      const line = lines[i];
      showTyping();
      later(() => {
        hideTyping();
        addBubble(line.t, "in", line.s);
        i++;
        later(deliverNext, readPause(700, 1200));
      }, typingDelay(line.t));
    };
    later(deliverNext, readPause(950, 1500));
  }

  function closeChatUI() {
    conversationPhase = "idle";
    session++;
    clearCloseTimer();
    hideQuickReplies();
    hideTyping();
    stopSessionTimer();

    current = null;
    msgInput.value = "";
    chatHistoryPushed = false;
    app.classList.remove("chat-open");

    setTimeout(() => {
      if (!app.classList.contains("chat-open")) {
        messages.innerHTML = '<div class="day-divider">Today</div>';
      }
    }, 320);
  }

  /* ================================================================
     CONVERSATION CLOSING
     ================================================================ */
  function closeConversation() {
    if (conversationPhase !== "active") return;
    conversationPhase = "closing";
    session++;
    clearCloseTimer();
    hideTyping();
    stopSessionTimer();
    hideQuickReplies();

    addEarnings(CONVERSATION_EARNINGS);

    Swal.fire({
      title: "Conversation closed",
      html: `The learner has closed this conversation.<br><br>You have earned <strong>Ksh ${CONVERSATION_EARNINGS.toLocaleString("en-KE")}</strong>.`,
      icon: "success",
      confirmButtonText: "OK",
      confirmButtonColor: "#0E7C66",
      allowOutsideClick: false,
      allowEscapeKey: false
    }).then(() => {
      const needsPop = chatHistoryPushed;
      closeChatUI();
      if (needsPop) {
        suppressNextPopstate = true;
        try { history.back(); } catch (e) { /* ignore */ }
      }
    });
  }

  /* ================================================================
     SEND
     ================================================================ */
  function sendMessage(raw) {
    const text = (raw || "").trim();
    if (!text || !current || conversationPhase !== "active") return;

    addBubble(text, "out");
    msgInput.value = "";
    hideQuickReplies();

    if (autoReplySent) {
      clearCloseTimer();
      closeTimer = later(() => { closeConversation(); }, 3000);
      return;
    }

    if (!autoReplyScheduled) {
      autoReplyScheduled = true;
      const reply = CANNED[replyIdx % CANNED.length];
      replyIdx++;
      later(() => {
        showTyping();
        later(() => {
          hideTyping();
          addBubble(reply.t, "in", reply.s);
          autoReplySent = true;
        }, typingDelay(reply.t));
      }, readPause(1300, 2200));
    }
  }

  /* ================================================================
     WITHDRAWAL
     ================================================================ */
  async function doWithdraw() {
    const amount = earningsBalance;

    Swal.fire({
      title: 'Sending to M-Pesa…',
      html: `
        <div style="text-align:center; padding: 8px 0;">
          <p style="margin-bottom: 10px;">Withdrawing <strong>KES ${amount.toLocaleString('en-KE')}</strong></p>
          <p style="color:#6B7C77; font-size:0.9rem;">Connecting to M-Pesa…</p>
        </div>
      `,
      allowOutsideClick: false,
      allowEscapeKey: false,
      didOpen: () => Swal.showLoading()
    });

    await new Promise(r => setTimeout(r, 1800));
    Swal.update({
      title: 'Confirming with M-Pesa…',
      html: `<div style="text-align:center; padding: 8px 0;"><p style="color:#6B7C77; font-size:0.9rem;">Securing your transaction…</p></div>`,
      didOpen: () => Swal.showLoading()
    });

    await new Promise(r => setTimeout(r, 1600));

    earningsBalance = 0;
    localStorage.setItem('earningsBalance', '0');
    updateBalanceDisplay();

    await Swal.fire({
      title: 'Withdrawal successful',
      html: `
        <div style="text-align:center;">
          <div style="font-size:2.5rem; margin-bottom:6px;">✅</div>
          <p><strong>KES ${amount.toLocaleString('en-KE')}</strong> has been queued for payout to your M-Pesa number.</p>
          <p style="color:#6B7C77; font-size:0.9rem; margin-top:12px;">As this is your first withdrawal, please allow up to <strong>24 hours</strong> for the funds to reflect. Subsequent withdrawals will be faster.</p>
        </div>
      `,
      icon: false,
      confirmButtonText: 'OK',
      confirmButtonColor: '#0E7C66',
      allowOutsideClick: false,
      allowEscapeKey: false
    });
  }

  withdrawBtn.addEventListener('click', async () => {
    if (earningsBalance <= 0) {
      Swal.fire({
        title: 'No earnings yet',
        html: 'Complete a teaching session to build up your balance.',
        icon: 'info',
        confirmButtonText: 'OK',
        confirmButtonColor: '#0E7C66'
      });
      return;
    }

    if (localStorage.getItem('withdrawalFeePaid') === 'true') {
      doWithdraw();
      return;
    }

    const paid = await chargeFee({
      amount: 999,
      title: 'Activate withdrawals',
      description: 'Pay a one-time fee of KES 999 to activate M-Pesa withdrawals to your phone.'
    });

    if (paid) {
      localStorage.setItem('withdrawalFeePaid', 'true');
      await Swal.fire({
        title: 'Withdrawals activated',
        html: 'You can now withdraw your earnings to M-Pesa anytime.',
        icon: 'success',
        confirmButtonText: 'Continue',
        confirmButtonColor: '#0E7C66'
      });
      doWithdraw();
    }
  });

  /* ================================================================
     EVENTS
     ================================================================ */
  chatList.addEventListener("click", e => {
    const item = e.target.closest(".chat-item");
    if (!item) return;
    const contact = contacts.find(c => c.id === Number(item.dataset.id));
    if (contact) tryOpenChat(contact);
  });

  searchEl.addEventListener("input", () => renderList(searchEl.value));

  backBtn.addEventListener("click", () => {
    if (app.classList.contains("chat-open") && chatHistoryPushed) {
      try { history.back(); } catch (e) { closeChatUI(); }
    } else {
      closeChatUI();
    }
  });

  composer.addEventListener("submit", e => {
    e.preventDefault();
    sendMessage(msgInput.value);
  });

  /* ================================================================
     POPSTATE — browser back button override
     ================================================================ */
  window.addEventListener('popstate', () => {
    if (suppressNextPopstate) {
      suppressNextPopstate = false;
      return;
    }
    if (app.classList.contains('chat-open')) {
      closeChatUI();
    }
  });

  /* ================================================================
     BOOT
     ================================================================ */
  updateBalanceDisplay();
  renderList();
})();
</script>
</body>
</html>
